name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-windows-gnu
            artifact: lc4-x86_64-windows.exe
          - target: x86_64-linux-gnu
            artifact: lc4-x86_64-linux
          - target: aarch64-linux-gnu
            artifact: lc4-aarch64-linux
          - target: x86_64-macos
            artifact: lc4-x86_64-macos
          - target: aarch64-macos
            artifact: lc4-aarch64-macos

    steps:
      - uses: actions/checkout@v4

      - uses: ziglang/setup-zig@v2
        with:
          version: master

      - run: zig version

      - name: Build
        run: zig build -Doptimize=ReleaseFast -Dtarget=${{ matrix.target }}

      - name: Rename binary
        shell: bash
        run: |
          if [[ "${{ matrix.target }}" == *"windows"* ]]; then
            cp zig-out/bin/lc4.exe "${{ matrix.artifact }}"
          else
            cp zig-out/bin/lc4 "${{ matrix.artifact }}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            lc4-x86_64-windows.exe
            lc4-x86_64-linux
            lc4-aarch64-linux
            lc4-x86_64-macos
            lc4-aarch64-macos
